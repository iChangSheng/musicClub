<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>口琴社活动简介</title>
<style>
:root{
  --ink:#0d0d0d;
  --paper:#f2f1ea;
  --pink:#ff2e88;
  --cyan:#00c8ff;
  --yellow:#ffe600;
  --lime:#8cff00;
  --orange:#ff5a00;
  --purple:#8a3dff;
}
*,*::before,*::after{box-sizing:border-box;border-radius:0!important;}
html{min-height:100%;overflow-x:hidden;}
body{
  margin:0;
  padding:5vh 3vw;
  min-height:100vh;
  color:var(--ink);
  background:var(--paper);
  background-image:
    linear-gradient(var(--ink) 1px,transparent 1px),
    linear-gradient(90deg,var(--ink) 1px,transparent 1px);
  background-size:56px 56px;
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","SimHei",sans-serif;
  font-size:clamp(15px,1.05vw + 0.6vh,19px);
  line-height:1.85;
  position:relative;
}
.frag{position:fixed;z-index:0;pointer-events:none;border:3px solid var(--ink);}
.frag-1{top:10%;left:3%;width:70px;height:70px;background:var(--orange);transform:rotate(-12deg);box-shadow:8px 8px 0 var(--ink);}
.frag-2{bottom:12%;right:4%;width:90px;height:34px;background:var(--cyan);transform:rotate(8deg);box-shadow:6px 6px 0 var(--ink);}
.frag-3{top:30%;right:2%;width:40px;height:90px;background:var(--pink);transform:rotate(-6deg);}

.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;}

section{
  background:#fff;border:4px solid var(--ink);
  box-shadow:12px 12px 0 var(--ink);
  padding:clamp(1.4rem,3vw,2.4rem);
  transform:rotate(-0.6deg);
}

h1{
  font-weight:900;
  font-size:clamp(32px,4.5vw,52px);
  line-height:1;
  margin:0 0 1.8rem;
  display:inline-block;
  background:var(--yellow);
  border:5px solid var(--ink);
  box-shadow:10px 10px 0 var(--ink);
  padding:0.15em 0.4em;
  transform:rotate(-1.5deg);
}
.title-row{margin-bottom:2rem;}
h3{
  font-weight:900;font-size:clamp(19px,2vw,26px);
  margin:1.5rem 0 0.8rem;
  display:inline-block;
  background:var(--cyan);border:3px solid var(--ink);
  padding:0.15em 0.5em;box-shadow:5px 5px 0 var(--ink);
  transform:rotate(-1deg);
}
p{margin:1.1rem 0;text-indent:2em;}

ul{
  border:4px solid var(--ink);
  background:var(--paper);
  box-shadow:8px 8px 0 var(--ink);
  padding:1rem 1.2rem 1rem 2.2rem;
  list-style:square;
}
li{margin:0.6rem 0;font-weight:700;}
li::marker{color:var(--pink);}

.back-link{
  display:inline-block;margin-top:1.8rem;
  font-weight:900;text-decoration:none;color:#fff;
  border:4px solid var(--ink);background:var(--pink);
  padding:0.55em 1.1em;box-shadow:6px 6px 0 var(--ink);
  transition:transform .1s,box-shadow .1s;
}
.back-link:hover{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink);}

@media (max-width:600px){
  body{padding:1.5rem 4vw;}
  section{transform:none;}
}
</style>
</head>
<body>
<div class="frag frag-1"></div>
<div class="frag frag-2"></div>
<div class="frag frag-3"></div>
<div class="wrap">
<section>
  <div class="title-row"><h1>口琴社活动简介</h1></div>

  <h3>活动基本信息：</h3>
  <ul>
    <li>活动名称：口琴社校园草坪小型音乐会</li>
    <li>活动时间：2026年春季5月</li>
    <li>活动地点：图书馆前大草坪</li>
  </ul>

  <p>活动现场社员分别演奏复音口琴、布鲁斯十孔口琴、半音阶口琴曲目，有独奏、重奏、大合奏。现场氛围轻松自由，路过的同学也可以点歌，是社团每年最受欢迎的线下活动。零基础社员也拥有上台合奏的机会。</p>

  <a class="back-link" href="li-0227-work2.html">← 返回口琴社招新主页</a>
</section>
</div>
</body>
</html>

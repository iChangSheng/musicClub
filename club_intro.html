<h3>活动基本信息：</h3>
<ul>
<li>活动名称：口琴社校园草坪小型音乐会</li>
<li>活动时间：2026年春季5月</li>
<li>活动地点：图书馆前大草坪</li>
</ul>
<p>活动现场社员分别演奏复音口琴、布鲁斯十孔口琴、半音阶口琴曲目，有独奏、重奏、大合奏。现场氛围轻松自由，路过的同学也可以点歌，是社团每年最受欢迎的线下活动。零基础社员也拥有上台合奏的机会。</p>
